name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    env:
      ENV: test
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/agrifos_test
      SUPABASE_URL: https://example.supabase.co

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check Python compilation
        run: uv run python -m compileall -q app alembic/versions

      - name: Verify a single Alembic head
        run: |
          HEAD_COUNT="$(uv run alembic heads | grep -c '(head)')"
          test "$HEAD_COUNT" -eq 1

      - name: Run backend tests
        run: uv run python -m unittest discover -s tests

  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app_flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
