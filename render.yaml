services:
  - type: web
    name: agrifos-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "300"
      - key: WEATHER_API_BASE_URL
        value: https://api.open-meteo.com/v1
      - key: WEATHER_FALLBACK_API_BASE_URL
        value: https://api.met.no/weatherapi/locationforecast/2.0
      - key: WEATHER_FALLBACK_USER_AGENT
        value: Agrifos/0.1 https://github.com/ferjovel06/agrifos
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
