[project]
name = "app"
version = "1.0.0b3"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.31.0",
    "pyjwt[crypto]>=2.8.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1,<1.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "sqlalchemy>=2.0.51",
]

[tool.fastapi]
entrypoint = "app.main:app"
